# ---------------------------------------------------------------------------
# Pheasant MCP connection and capability map.
#
# Tool names are configured, not assumed: the server implementation may
# evolve, and a lab that hard-codes names discovers the mismatch during a paid
# run. `doctor` fails before any spend when a required capability is missing,
# when a configured tool does not appear in tools/list, or when the local
# adapter cannot satisfy the tool's advertised JSON Schema.
#
# The defaults match pheasant >= 0.12.6 (see its docs/mcp_tools.md), checked
# end to end against 0.12.16, 0.13.0, 0.13.1, 0.13.2, 0.13.4, 0.13.11 and
# 0.14.0, standalone and role-split. As shipped it targets 0.14.0: `expand`
# (0.13.1, below; see there for older regions), `get_index_queue` (0.13.2,
# optional) and `describe_source` (0.13.3, optional). Since 0.13.5 the tools
# this map names gained only optional arguments it does not send
# (`search_context`'s `path_prefix` and `exclude_documents`,
# `submit_documents`'s `content_encoding`); 0.14.0 adds `edit_source_urls`,
# which the lab does not use, and sends a receipt whose key lands in another
# source back to `accepted`. The HTTP MCP body limit (64 MiB by default) is
# far above a 20-document text batch.
#
# Use the URL as given (`/mcp`): pheasant answers it with a redirect to
# `/mcp/`, and the client adopts a same-origin redirect once per session
# rather than paying it on every call.
# ---------------------------------------------------------------------------

transport: ${PHEASANT_MCP_TRANSPORT:-streamable_http}
url: ${PHEASANT_MCP_URL:-http://127.0.0.1:8765/mcp}
command: ${PHEASANT_MCP_COMMAND:-}
token_env: PHEASANT_API_TOKEN
protocol_version: "2026-07-28"
timeout_seconds: 60
connect_timeout_seconds: 10
max_retries: 3
retry_backoff_seconds: 1.0
retry_backoff_max_seconds: 20.0

knowledge_base: ${PHEASANT_KNOWLEDGE_BASE:-pheasant-lab}
source_name: ${PHEASANT_SOURCE_NAME:-swarm-lab-literature}

capabilities:
  health:
    tool: ${PHEASANT_TOOL_HEALTH:-list_knowledge_bases}
    required: true
  ingest:
    tool: ${PHEASANT_TOOL_INGEST:-submit_documents}
    required: true
  ingest_status:
    tool: ${PHEASANT_TOOL_INGEST_STATUS:-get_ingest_status}
    required: true
  ingest_acknowledge:
    tool: ${PHEASANT_TOOL_INGEST_ACK:-acknowledge_ingest}
    required: false
  ingest_reconcile:
    tool: ${PHEASANT_TOOL_INGEST_RECONCILE:-reconcile_ingest}
    required: false
  # Pheasant lands submitted documents in a directory and does not index it
  # until that directory is registered as a source; the lab registers it
  # before the first sync. The region must allow-list its state path
  # (`security.allow_workspace_roots: [/state, ...]`) for this to be accepted.
  register_source:
    tool: ${PHEASANT_TOOL_REGISTER:-register_source}
    required: true
  sync:
    tool: ${PHEASANT_TOOL_SYNC:-sync_source}
    required: true
  search:
    tool: ${PHEASANT_TOOL_SEARCH:-search_context}
    required: true
  # Reads a retrieved document back whole. A search hit carries a capped
  # preview; without this the answering arms read previews only.
  fetch:
    tool: ${PHEASANT_TOOL_FETCH:-get_file_summary}
    required: false
  write_memory:
    tool: ${PHEASANT_TOOL_MEMORY_WRITE:-memory_write}
    required: false
  snapshot:
    tool: ${PHEASANT_TOOL_SNAPSHOT:-seal_snapshot}
    required: false
  snapshot_get:
    tool: ${PHEASANT_TOOL_SNAPSHOT_GET:-get_snapshot}
    required: false
  describe_retrieval:
    tool: ${PHEASANT_TOOL_DESCRIBE_RETRIEVAL:-describe_retrieval}
    required: false
  record_evidence:
    tool: ${PHEASANT_TOOL_RECORD_EVIDENCE:-record_evidence}
    required: false
  # pheasant >= 0.13.2 (absent before it, which is fine). On a fleet
  # `sync_source` answers `status: queued`: the sync was published, not run. While the ingest barrier waits, the lab
  # reads this to report whether an indexer has claimed the task yet
  # (`ingest.queue` events), rather than showing an unexplained wait. A
  # memory write's sync is published the same way, and the seeder reads this
  # to hold P1 until its memory is searchable (`memory.indexed`).
  # Observational only: it is left out of the config digest.
  index_queue:
    tool: ${PHEASANT_TOOL_INDEX_QUEUE:-get_index_queue}
    required: false
  # pheasant >= 0.13.3 (absent before it, which is fine). After the barrier
  # the lab asks the region what it holds for the lab's source - a count
  # read off the region's own index - and records it beside the indexed
  # receipts (`ingest.inventory`: consistent | mismatch). Reconcile asks
  # whether every receipt's artifact is there; this is the converse. The
  # console's region chip reads the same answer over HTTP. Observational
  # only: left out of the config digest, like index_queue.
  source_inventory:
    tool: ${PHEASANT_TOOL_SOURCE_INVENTORY:-describe_source}
    required: false

discovery:
  verify_configured_tool_exists: true
  verify_input_schema: true
  fail_on_ambiguous_capability: true
  allow_heuristic_name_matching: false

# How the lab's stable internal request shape is spelled for this server.
# Changing a server's parameter names is a config edit, not a code change.
#
# A key that is ABSENT here is an argument the lab will not send. That is how
# a capability the region does not offer is declared. pheasant >= 0.12.6
# accepts `snapshot_id` and `as_of` on `search_context` (before that they were
# HTTP-only), so both are mapped and `P0` is pinned to the sealed snapshot: the
# region answers from that state or refuses. Against an older region, delete
# those two lines - mapping a name the tool does not accept is worse than
# leaving it out, and `doctor` checks every mapped name against the tool's
# advertised schema for exactly this reason.
#
# `expand` (graph neighbourhoods on each hit) arrived in pheasant 0.13.1, and
# is mapped so `replay.graph_expansion` in the experiment file can turn it on.
# Mapping it sends nothing by itself - the experiment decides that - but it
# does make `doctor` refuse a region whose search tool does not take it.
# Against pheasant 0.12.6-0.13.0, delete the line or pass
# `--set argument_map.search.expand=null`; `doctor` refuses
# `replay.graph_expansion` without it.
argument_map:
  knowledge_base_field: knowledge_base
  search:
    query: query
    max_results: max_results
    mode: mode
    memory: memory
    session: session
    source_name: source_name
    exclude_sources: exclude_sources
    node_types: node_types
    min_score: min_score
    principal: principal
    snapshot_id: snapshot_id
    as_of: as_of
    expand: expand
  ingest:
    documents: documents
    source_name: source_name
    submission_id: submission_id
    agent_id: agent_id
    document_path: relative_path
    document_text: text
    document_key: idempotency_key
    document_metadata: metadata

isolation:
  # The lab never writes to a source it did not create, and never writes
  # memory outside the arms that are meant to.
  refuse_shared_knowledge_base: false
  require_dedicated_source: true
  forbid_memory_writes_in_arms: [S0, C0, P0]
