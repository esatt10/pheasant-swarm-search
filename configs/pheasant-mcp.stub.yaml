# Isolated local Pheasant; use with deploy/stub/compose.yaml.
transport: streamable_http
url: http://127.0.0.1:8766/mcp
command: ""
token_env: PHEASANT_STUB_MCP_TOKEN
protocol_version: "2026-07-28"
timeout_seconds: 60
connect_timeout_seconds: 10
max_retries: 3
retry_backoff_seconds: 1.0
retry_backoff_max_seconds: 20.0

knowledge_base: pheasant-swarm-stub
source_name: swarm-lab-literature

capabilities:
  list_sources:
    tool: list_sources
    required: true
  register_source:
    tool: register_source
    required: true
  health:
    tool: list_knowledge_bases
    required: true
  ingest:
    tool: submit_documents
    required: true
  ingest_status:
    tool: get_ingest_status
    required: true
  ingest_acknowledge:
    tool: acknowledge_ingest
    required: false
  ingest_reconcile:
    tool: reconcile_ingest
    required: false
  sync:
    tool: sync_source
    required: false
  search:
    tool: search_context
    required: true
  fetch:
    tool: get_file_summary
    required: false
  write_memory:
    tool: memory_write
    required: false
  snapshot:
    tool: seal_snapshot
    required: false
  snapshot_get:
    tool: get_snapshot
    required: false
  describe_retrieval:
    tool: describe_retrieval
    required: false
  record_evidence:
    tool: record_evidence
    required: false

discovery:
  verify_configured_tool_exists: true
  verify_input_schema: true
  fail_on_ambiguous_capability: true
  allow_heuristic_name_matching: false

# How the lab's stable internal request shape is spelled for this server.
# Changing a server's parameter names is a config edit, not a code change.
#
# Pinned to the Pheasant 0.12.5 Docker profile. Doctor validates each mapped name.
argument_map:
  knowledge_base_field: knowledge_base
  search:
    query: query
    snapshot_id: snapshot_id
    as_of: as_of
    max_results: max_results
    mode: mode
    memory: memory
    session: session
    source_name: source_name
    exclude_sources: exclude_sources
    node_types: node_types
    min_score: min_score
    principal: principal
  fetch:
    path: path
    source_name: source_name
    principal: principal
  ingest:
    documents: documents
    source_name: source_name
    submission_id: submission_id
    agent_id: agent_id
    document_path: relative_path
    document_text: text
    document_key: idempotency_key
    document_metadata: metadata

isolation:
  # The lab never writes to a source it did not create, and never writes
  # memory outside the arms that are meant to.
  refuse_shared_knowledge_base: false
  require_dedicated_source: true
  forbid_memory_writes_in_arms: [S0, C0, P0]
